name: Update news and deploy Pages

on:
  schedule:
    # 每天 UTC 04:00 和 16:00，即北京时间 12:00 和次日 00:00。
    - cron: "0 4,16 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests (advisory)
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Fetch and export static data
        env:
          # GitHub 自动提供临时令牌，用于提高仓库搜索、commit 搜索和 Releases
          # API 的限流额度；令牌不会写入仓库或网页数据。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 只在主动推送或手动运行时回填一次 60 天历史；
          # 每天两次的定时任务继续只抓当期数据，避免重复执行重任务。
          BACKFILL_DAYS: ${{ github.event_name == 'schedule' && '0' || '60' }}
        run: python scripts/github_update.py

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json public/style.css
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AI music news [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error title=数据推送失败::连续三次推送失败，旧版 Pages 将继续在线"
              exit 1
            fi
          fi

      - name: Report failed update
        if: failure()
        run: |
          echo "::error title=自动更新失败::本次没有发布新数据，上一版 Pages 保持在线"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
