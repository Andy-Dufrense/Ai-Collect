name: Update news and deploy Pages

on:
  schedule:
    # 每天 UTC 00:00 和 12:00，即北京时间 08:00 和 20:00。
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure issue labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pending-news \
            --color FBCA04 \
            --description "等待维护者审核的资讯" 2>/dev/null || true
          gh label create approved-news \
            --color 0E8A16 \
            --description "批准并发布到情报台" 2>/dev/null || true

      - name: Fetch and export static data
        run: python scripts/github_update.py

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json public/style.css
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AI music news [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
