<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI 与音乐交叉领域每日情报排行">
    <title>AI × 音乐情报台</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand-block">
                <p class="product-sign">AI // MUSIC INTELLIGENCE</p>
                <h1>每日情报台</h1>
                <p class="product-note">GitHub Actions 自动更新 · 按真实发布时间倒序展示</p>
            </div>
            <div class="system-panel">
                <div class="sync-state offline" id="sync-state">
                    <span class="sync-dot" aria-hidden="true"></span>
                    <span id="sync-text">正在读取数据</span>
                </div>
                <div class="system-stat">
                    <span>总收录</span>
                    <strong id="total-count">--</strong>
                </div>
                <div class="system-stat">
                    <span>最近更新</span>
                    <strong id="generated-at">--</strong>
                </div>
            </div>
        </header>

        <section class="control-bar" aria-label="资讯筛选">
            <form class="filter-form" id="filter-form">
                <label class="search-field">
                    <span>搜索（多个词用；分隔，任一命中）</span>
                    <input id="keyword" name="q" type="search"
                           placeholder="MIDI；吉他；编曲">
                </label>
                <label class="days-field">
                    <span>时间范围</span>
                    <select id="days" name="days">
                        <option value="1">最近 1 天</option>
                        <option value="3" selected>最近 3 天</option>
                        <option value="7">最近 7 天</option>
                        <option value="14">最近 14 天</option>
                        <option value="30">最近 30 天</option>
                        <option value="60">最近 60 天</option>
                    </select>
                </label>
                <label class="date-field">
                    <span>指定日期</span>
                    <input id="specific-date" name="date" type="date">
                </label>
                <label class="kind-field">
                    <span>内容类型</span>
                    <select id="content-kind" name="kind">
                        <option value="all" selected>全部</option>
                        <option value="hardware">硬件相关</option>
                        <option value="software">软件相关</option>
                    </select>
                </label>
                <label class="sort-field">
                    <span>排序方式</span>
                    <select id="sort-by" name="sort">
                        <option value="time" selected>按时间</option>
                        <option value="heat">按热度</option>
                        <option value="relevance">按 AI+音乐关联度</option>
                    </select>
                </label>
                <a class="reset-link" href="./">重置</a>
            </form>
        </section>

        <div class="result-toolbar">
            <span id="result-summary">正在加载...</span>
        </div>

        <section class="news-feed" aria-label="资讯排行">
            <div class="feed-header">
                <span>#</span>
                <span>标题</span>
                <span>来源</span>
                <span>发布时间</span>
            </div>
            <div id="news-list"></div>
        </section>
        <nav class="pagination" id="pagination" aria-label="资讯分页" hidden>
            <button type="button" class="page-button" id="page-prev">上一页</button>
            <span class="page-numbers" id="page-numbers"></span>
            <button type="button" class="page-button" id="page-next">下一页</button>
        </nav>

        <section class="empty-state" id="empty-state" hidden>
            <p class="empty-code">NO MATCHED SIGNAL</p>
            <h2>当前条件下没有资讯</h2>
            <p>尝试扩大时间范围、清除关键词，或等待下一次自动更新。</p>
        </section>

        <footer class="app-footer">
            <span>GITHUB ACTIONS · RSS / WEIXIN SEARCH / AUDITED ISSUES</span>
            <span>时间范围依据文章原始发布时间</span>
        </footer>
    </div>
    <script src="./app.js" defer></script>
</body>
</html>
