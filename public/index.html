<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI 与音乐交叉领域每日情报排行">
    <title>AI × 音乐情报台</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand-block">
                <p class="product-sign">AI // MUSIC INTELLIGENCE</p>
                <h1>每日情报台</h1>
                <p class="product-note">GitHub Actions 自动更新 · 按相关度、热度与新鲜度排序</p>
            </div>
            <div class="system-panel">
                <div class="sync-state offline" id="sync-state">
                    <span class="sync-dot" aria-hidden="true"></span>
                    <span id="sync-text">正在读取数据</span>
                </div>
                <div class="system-stat">
                    <span>总收录</span>
                    <strong id="total-count">--</strong>
                </div>
                <div class="system-stat">
                    <span>最近更新</span>
                    <strong id="generated-at">--</strong>
                </div>
            </div>
        </header>

        <section class="control-bar" aria-label="资讯筛选">
            <form class="filter-form" id="filter-form">
                <label class="search-field">
                    <span>搜索</span>
                    <input id="keyword" name="q" type="search"
                           placeholder="吉他、钢琴、乐理、Suno...">
                </label>
                <label class="days-field">
                    <span>时间范围</span>
                    <select id="days" name="days">
                        <option value="1">最近 1 天</option>
                        <option value="3" selected>最近 3 天</option>
                        <option value="7">最近 7 天</option>
                        <option value="14">最近 14 天</option>
                        <option value="30">最近 30 天</option>
                        <option value="0">全部时间</option>
                    </select>
                </label>
                <label class="date-field">
                    <span>指定日期</span>
                    <input id="specific-date" name="date" type="date">
                </label>
                <a class="reset-link" href="./">重置</a>
            </form>
            <div class="control-actions">
                <a class="text-action"
                   href="https://github.com/Andy-Dufrense/Ai-Collect/issues/new?template=add-news.yml"
                   target="_blank" rel="noopener noreferrer">+ 提交资讯</a>
                <a class="sync-button button-link"
                   href="https://github.com/Andy-Dufrense/Ai-Collect/actions/workflows/update-pages.yml"
                   target="_blank" rel="noopener noreferrer">更新记录</a>
            </div>
        </section>

        <div class="result-toolbar">
            <span id="result-summary">正在加载...</span>
        </div>

        <section class="news-feed" aria-label="资讯排行">
            <div class="feed-header">
                <span>#</span>
                <span>标题</span>
                <span>来源</span>
                <span>发布时间</span>
            </div>
            <div id="news-list"></div>
        </section>
        <div class="load-more-wrap">
            <button type="button" class="load-more-button" id="load-more">
                显示更多
            </button>
            <span id="load-status"></span>
        </div>

        <section class="empty-state" id="empty-state" hidden>
            <p class="empty-code">NO MATCHED SIGNAL</p>
            <h2>当前条件下没有资讯</h2>
            <p>尝试扩大时间范围、清除关键词，或等待下一次自动更新。</p>
        </section>

        <footer class="app-footer">
            <span>GITHUB ACTIONS · RSS / WEIXIN SEARCH / AUDITED ISSUES</span>
            <span>热度为来源权重与热词估算值</span>
        </footer>
    </div>
    <script src="./app.js" defer></script>
</body>
</html>
